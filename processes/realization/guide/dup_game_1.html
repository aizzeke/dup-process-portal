<title>ДУП · Твоя роль в процессе</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>

    --escalate-soft:#f7e6e2;

    --stage:#7fd0bd; --stage-soft:#16302a; --stage-ink:#bdf0e0;

  /* ---- intro: role grid ---- */
  .role-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; margin-top:26px; }
  .role-card{ text-align:left; background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); cursor:pointer; }

  .std-toggle{ margin-top:14px; font-family:"IBM Plex Mono", monospace; font-size:11.5px; font-weight:600; color:var(--stage-ink); background:var(--stage-soft); border:1px solid var(--stage); border-radius:8px; padding:7px 12px; cursor:pointer; }
  .std-toggle:hover{ filter:brightness(1.05); }
  .std-panel{ margin-top:12px; display:flex; flex-direction:column; gap:10px; }
  .std-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); }
  .std-card-title{ font-family:"Golos Text", sans-serif; font-weight:700; font-size:13.5px; color:var(--gate-ink); margin-bottom:7px; }

  .g-independence{ margin-top:10px; font-size:11.5px; line-height:1.5; color:var(--gate-ink); background:var(--paper-raised); border:1px dashed var(--gate); border-radius:8px; padding:9px 12px; }

  .raci-toggle{ margin-top:12px; font-family:"IBM Plex Mono", monospace; font-size:11.5px; font-weight:600; color:var(--raci); background:var(--raci-soft); border:1px solid var(--raci); border-radius:8px; padding:7px 12px; cursor:pointer; }

  .raci-table th{ position:sticky; top:0; background:var(--paper-raised); text-align:left; font-family:"IBM Plex Mono", monospace; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:9px 12px; border-bottom:1px solid var(--line); }
  .raci-table td{ padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top; color:var(--ink); line-height:1.4; }

  .raci-table td.raci-step{ max-width:340px; }
  .raci-stage-row td{ background:var(--stage-soft); color:var(--stage-ink); font-weight:700; font-family:"Golos Text", sans-serif; font-size:12.5px; padding:9px 12px; }

  .stake-row{ margin-top:12px; font-size:12px; color:var(--muted); line-height:1.7; }
  .stake-row .stake-label{ font-family:"IBM Plex Mono", monospace; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-right:6px; }
  .stake-row .chip{ margin:0 3px 3px 0; }

  .chip.raci{ background:var(--raci-soft); color:var(--raci); border-color:var(--raci); font-weight:700; }

  footer{ margin-top:44px; padding-top:18px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); line-height:1.6; max-width:70ch; }

  /* ---- walk screen ---- */
  .walk-top{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .walk-role{ font-family:"Golos Text", sans-serif; font-weight:700; font-size:19px; }
  .walk-back{ font-family:"IBM Plex Mono", monospace; font-size:11.5px; font-weight:600; color:var(--muted); background:none; border:1px solid var(--line); border-radius:99px; padding:6px 13px; cursor:pointer; }
  .walk-back:hover{ border-color:var(--stage); color:var(--stage-ink); }
  .walk-count{ font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:var(--muted); white-space:nowrap; }

  .moment-trigger{ font-size:12.5px; color:var(--muted); background:var(--zebra); border-radius:10px; padding:9px 12px; margin-top:10px; line-height:1.5; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }

  .chip.para{ background:var(--paper); color:var(--muted); }
  .chip.sla{ background:var(--gate-soft); color:var(--gate-ink); border-color:var(--gate); }

  .moment-text{ font-size:16px; line-height:1.55; margin-top:16px; color:var(--ink); }

  .flow-label-row{ font-family:"IBM Plex Mono", monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-top:18px; }
  .flow-chain{ display:flex; align-items:center; flex-wrap:wrap; gap:2px 4px; margin-top:9px; }
  .flow-node{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:var(--zebra); border:1px solid var(--line); border-radius:10px; padding:8px 9px; min-width:62px; max-width:110px; text-align:center; }
  .flow-node.me{ background:var(--stage-soft); border-color:var(--stage); box-shadow:0 0 0 2px var(--stage-soft); }
  .flow-icon{ font-size:17px; line-height:1; }
  .flow-label{ font-family:"IBM Plex Mono", monospace; font-size:9px; font-weight:600; color:var(--ink); line-height:1.25; word-break:break-word; }
  .flow-node.me .flow-label{ color:var(--stage-ink); }
  .flow-arrow{ color:var(--muted); font-size:14px; flex:none; padding:0 1px; }
  .flow-plus{ color:var(--muted); font-size:15px; font-weight:700; flex:none; padding:0 2px; }

  .flow-approve{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:9px; }
  .flow-cluster{ display:flex; flex-direction:column; gap:6px; align-items:center; }
  .flow-cluster-label{ font-family:"IBM Plex Mono", monospace; font-size:9px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .flow-cluster-nodes{ display:flex; align-items:center; gap:0; flex-wrap:wrap; padding:9px; border:1px dashed var(--line); border-radius:12px; }
  .flow-big-arrow{ display:flex; flex-direction:column; align-items:center; color:var(--muted); font-size:20px; line-height:1; flex:none; }
  .flow-arrow-label{ font-family:"IBM Plex Mono", monospace; font-size:8.5px; font-weight:600; color:var(--stage-ink); white-space:nowrap; margin-top:3px; }
  .flow-node.target-approve{ border-width:2px; border-color:var(--gate); box-shadow:0 0 0 3px var(--gate-soft); }
  .flow-node.target-converge{ border-width:2px; border-color:var(--stage); box-shadow:0 0 0 3px var(--stage-soft); }

  .flow-node.doc{ background:var(--gate-soft); border:1.5px dashed var(--gate); min-width:118px; }
  .flow-node.doc .flow-label{ color:var(--gate-ink); }
  .flow-doc-sub{ font-family:"IBM Plex Mono", monospace; font-size:8px; font-weight:500; color:var(--muted); line-height:1.3; margin-top:1px; }
  .flow-role-note{ font-family:"IBM Plex Mono", monospace; font-size:8.5px; color:var(--muted); text-align:center; max-width:90px; line-height:1.25; }
  .flow-node-wrap{ display:flex; flex-direction:column; align-items:center; gap:5px; }
  .flow-dual-block{ margin-top:10px; }
  .flow-dual-label{ font-family:"IBM Plex Mono", monospace; font-size:9.5px; font-weight:600; color:var(--stage-ink); margin-bottom:7px; }
  .flow-dual-divider{ height:1px; background:var(--line); margin:16px 0 4px; }

  .checklist{ margin-top:16px; }
  .checklist-head{ font-family:"IBM Plex Mono", monospace; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:8px; }
  .checklist-items{ display:flex; flex-direction:column; gap:7px; }
  .checklist-item{ display:flex; align-items:flex-start; gap:10px; background:var(--done-soft); border:1px solid var(--done); border-radius:10px; padding:9px 13px; font-size:13px; color:var(--ink); line-height:1.45; }
  .checklist-check{ flex:none; width:19px; height:19px; margin-top:1px; border-radius:50%; background:var(--done); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }

  .doc-io{ display:flex; gap:14px; flex-wrap:wrap; margin-top:16px; }
  .doc-io-col{ flex:1 1 220px; min-width:200px; }
  .doc-io-head{ font-family:"IBM Plex Mono", monospace; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .doc-io-head.in{ color:var(--stage-ink); }
  .doc-io-head.out{ color:var(--gate-ink); }
  .doc-io-item{ display:flex; align-items:flex-start; gap:8px; border-radius:9px; padding:8px 11px; font-size:12px; line-height:1.4; margin-bottom:6px; }
  .doc-io-item.in{ background:var(--stage-soft); border:1px solid var(--stage); color:var(--ink); }
  .doc-io-item.out{ background:var(--gate-soft); border:1px solid var(--gate); color:var(--ink); }
  .doc-io-icon{ flex:none; font-size:13px; line-height:1.3; }
  .doc-io-tag{ font-family:"IBM Plex Mono", monospace; font-size:10px; font-weight:700; color:var(--muted); white-space:nowrap; }

  .cond-list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .cond-item{ display:flex; align-items:flex-start; gap:8px; background:var(--paper-raised); border:1px solid var(--gate); border-radius:8px; padding:7px 11px; font-size:12px; line-height:1.4; color:var(--ink); }
  .cond-check{ flex:none; width:16px; height:16px; margin-top:1px; border-radius:50%; background:var(--gate); color:#fff; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; }

  .branch-btn{ margin-top:16px; font-family:"IBM Plex Mono", monospace; font-size:11.5px; font-weight:600; color:var(--stage-ink); background:var(--stage-soft); border:1px solid var(--stage); border-radius:8px; padding:7px 12px; cursor:pointer; }
  .branch-btn:hover{ filter:brightness(1.05); }
  .branch-panel{ margin-top:12px; font-size:12.5px; line-height:1.55; color:var(--ink); background:var(--zebra); border-left:3px solid var(--stage); border-radius:0 10px 10px 0; padding:11px 14px; }

  .gate-box{ margin-top:16px; background:var(--gate-soft); border:1px solid var(--gate); border-radius:12px; padding:16px 18px; }
  .gate-box .g-title{ font-family:"Golos Text", sans-serif; font-weight:700; font-size:15px; color:var(--gate-ink); }
  .gate-box .g-cond{ font-size:13px; line-height:1.55; color:var(--ink); margin-top:7px; }
  .gate-box .g-esc{ font-size:11.5px; color:var(--escalate); margin-top:8px; font-weight:600; }
  .g-choices{ margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
  .btn{ font-family:"IBM Plex Mono", monospace; font-size:12px; font-weight:600; border-radius:8px; padding:8px 14px; cursor:pointer; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); }
  .btn:hover{ border-color:var(--stage); }
  .btn.primary{ background:var(--stage); border-color:var(--stage); color:#fff; }
  .btn.good{ border-color:var(--done); color:var(--done); }
  .btn.good.picked{ background:var(--done); color:#fff; }
  .btn.bad{ border-color:var(--escalate); color:var(--escalate); }
  .btn.bad.picked{ background:var(--escalate); color:#fff; }
  .btn.ghost{ background:none; }
  .btn[disabled]{ opacity:.4; cursor:default; }
  .g-outcome{ margin-top:12px; font-size:12.5px; line-height:1.55; border-radius:10px; padding:11px 14px; }
  .g-outcome.good{ background:var(--done-soft); color:var(--done); }
  .g-outcome.bad{ background:var(--escalate-soft); color:var(--escalate); }
  .g-reveal-btn{ margin-top:14px; }
  .g-guide{ margin-top:12px; font-size:12.5px; line-height:1.6; color:var(--ink); background:var(--paper-raised); border:1px solid var(--gate); border-radius:10px; padding:12px 14px; }

  .nav-row{ display:flex; align-items:center; justify-content:space-between; margin-top:20px; gap:10px; }
  .nav-spacer{ flex:1; }

  /* ---- done screen ---- */
  .done-hero{ background:var(--paper-raised); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:30px 26px; text-align:center; margin-top:24px; }
  .done-big{ font-family:"Golos Text", sans-serif; font-weight:700; font-size:32px; color:var(--stage-ink); }
  .done-sub{ font-size:13.5px; color:var(--muted); margin-top:8px; }
  .done-stages{ display:flex; justify-content:center; flex-wrap:wrap; gap:6px; margin-top:16px; }
  .done-actions{ margin-top:20px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }

  .recap{ margin-top:28px; }
  .recap h2{ font-family:"Golos Text", sans-serif; font-weight:600; font-size:16px; margin:0 0 12px; }
  .recap-item{ display:flex; gap:10px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .recap-item:last-child{ border-bottom:none; }
  .recap-item .rp{ font-family:"IBM Plex Mono", monospace; color:var(--muted); flex:none; width:52px; }
  .recap-item .rt{ color:var(--ink); line-height:1.5; }

  @media (max-width:640px){ .page{ padding:30px 16px 70px; } .moment-card{ padding:18px 16px; } }
</style>

/* ---------- journey builder ---------- */

function buildJourney(key){
  var seq = [];
  STAGE_DEFS.forEach(function(stage){
    var firstDone = false;
    stage.items.forEach(function(item){
      var include = false, kind = null;
      if (key === "overview"){
        include = true; kind = item.t === "gate" ? "gate-overview" : "step-overview";
      } else if (item.t === "step"){
        if (item.actors.indexOf(key) !== -1){ include = true; kind = "step"; }
      } else if (item.t === "gate"){
        if (key === "СМиК"){ include = true; kind = "gate-review"; }
        else if (key === "ГД ДУП"){ include = true; kind = "gate-escalation"; }
      }
      if (include){
        seq.push({stage:stage, item:item, kind:kind, isFirstOfStage: !firstDone});
        firstDone = true;
      }
    });
  });
  return seq;
}

function stagesTouched(journey){
  var set = {};
  journey.forEach(function(m){ set[m.stage.id] = true; });
  return Object.keys(set).map(Number);
}

/* ---------- RACI helpers ---------- */

function raciCode(item, role){
  var parts = [];
  if (item.r && item.r.indexOf(role) !== -1) parts.push("R");
  if (item.a && item.a.indexOf(role) !== -1) parts.push("A");
  if (item.c && item.c.indexOf(role) !== -1) parts.push("C");
  if (item.i && item.i.indexOf(role) !== -1) parts.push("I");
  return parts.length ? parts.join(" + ") : null;
}

function renderRaciBreakdown(item){
  var rows = [];
  if (item.r && item.r.length) rows.push('<div class="stake-row"><span class="stake-label">R · исполнитель:</span>' + item.r.map(function(a){ return chip(a); }).join("") + '</div>');
  if (item.a && item.a.length) rows.push('<div class="stake-row"><span class="stake-label">A · ответственный:</span>' + item.a.map(function(a){ return chip(a); }).join("") + '</div>');
  if (item.c && item.c.length) rows.push('<div class="stake-row"><span class="stake-label">C · консультируется:</span>' + item.c.map(function(a){ return chip(a); }).join("") + '</div>');
  if (item.i && item.i.length) rows.push('<div class="stake-row"><span class="stake-label">I · информируется:</span>' + item.i.map(function(a){ return chip(a); }).join("") + '</div>');
  return rows.join("");
}

function renderRaciTable(){
  var rows = "";
  STAGE_DEFS.forEach(function(stage){
    rows += '<tr class="raci-stage-row"><td colspan="6">Этап ' + stage.id + ' · ' + esc(stage.title) + '</td></tr>';
    stage.items.forEach(function(item){
      var label = item.t === "gate" ? item.title : item.text;
      var no = item.t === "gate" ? ("Gate " + item.id.slice(1)) : item.no;
      if (!item.r && !item.a && !item.c && !item.i) return;
      rows += '<tr>' +
        '<td class="raci-no">' + esc(no) + '</td>' +
        '<td class="raci-step">' + esc(label) + '</td>' +
        '<td>' + esc((item.r||[]).join(", ") || "—") + '</td>' +
        '<td>' + esc((item.a||[]).join(", ") || "—") + '</td>' +
        '<td>' + esc((item.c||[]).join(", ") || "—") + '</td>' +
        '<td>' + esc((item.i||[]).join(", ") || "—") + '</td>' +
      '</tr>';
    });
  });
  return '<div class="raci-legend"><b>R</b> — исполнитель, <b>A</b> — ответственный (утверждает результат), <b>C</b> — консультируется, <b>I</b> — информируется.</div>' +
    '<div class="raci-table-wrap"><table class="raci-table"><thead><tr><th>№</th><th>Шаг</th><th>R</th><th>A</th><th>C</th><th>I</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

}

    var frameworkLine = std ? '<div class="rframework">' + esc(std.badge) + '</div>' : "";
    return '<button type="button" class="role-card" data-action="start" data-key="' + esc(r) + '">' +
      '<div class="rname">' + esc(r) + '</div>' +
      '<div class="rtag">' + esc(ROLE_META[r]) + '</div>' +
      frameworkLine +
      '<div class="rcount">' + len + ' ' + pluralMoments(len) + ' в процессе</div>' +
    '</button>';
  }).join("");
  var standardsPanel = standardsOpen ?
    '<div class="std-panel">' + stdCardHTML(ROLE_STANDARD["МП"]) + stdCardHTML(ROLE_STANDARD["СМиК"]) + '</div>' : "";
  return '' +
  '<div class="kicker">ДУП · Единый регламент</div>' +
  '<h1>Пройди свою роль в процессе</h1>' +
  '<p class="lede">Выберите роль — и пройдите по всем моментам Единого регламента, где действуете именно вы: что делать, когда и кому передать результат. Каждый шаг — реальный пункт документа.</p>' +
  '<div class="note-strip">Это не тест: здесь нет баллов и правильных/неправильных ответов — только ваш путь по процессу, в своём темпе.</div>' +
  '<div>' +
    '<button type="button" class="std-toggle" data-action="standards-toggle">' + (standardsOpen ? "Скрыть" : "📚 Как роли МП и СМиК соотносятся с PRINCE2 / PMI PMBOK? →") + '</button>' +
    standardsPanel +
  '</div>' +
  '<div>' +
    '<button type="button" class="raci-toggle" data-action="raci-toggle">' + (raciTableOpen ? "Скрыть сводную RACI-таблицу" : "📋 Показать сводную RACI-таблицу — все " + STAGE_DEFS.reduce(function(n,s){return n+s.items.length;},0) + " шагов →") + '</button>' +
    (raciTableOpen ? renderRaciTable() : "") +
  '</div>' +
  '<div class="role-grid">' +
    '<button type="button" class="role-card overview" data-action="start" data-key="overview">' +
      '<div class="rname">🗺 Весь процесс целиком</div>' +
      '<div class="rtag">Все 9 этапов и 7 гейтов подряд, с указанием, кто за что отвечает — чтобы увидеть, как роли передают эстафету друг другу. Подготовка и проверка гейтов разделены между МП и СМиК — принцип «сегрегация обязанностей», как в PRINCE2 (Project Assurance).</div>' +
      '<div class="rcount">' + overviewLen + ' ' + pluralMoments(overviewLen) + '</div>' +
    '</button>' +
    cards +
  '</div>' +
  '<footer>Тренажёр охватывает все роли Единого регламента ДУП (версия с независимым гейт-контролем СМиК). Содержание построено на тех же пунктах, что и полный текст регламента — номер параграфа показан при каждом шаге.</footer>';
}

/* ---------- render: walk ---------- */

function chip(text, cls){ return '<span class="chip' + (cls ? ' ' + cls : '') + '">' + esc(text) + '</span>'; }

function actorsChipsHTML(actors, role){
  if (!actors || !actors.length) return chip("процесс / система", "");
  return actors.map(function(a){ return chip(a, a === role ? "me" : ""); }).join("");
}

function flowNode(label, icon, me){
  return '<div class="flow-node' + (me ? ' me' : '') + '"><span class="flow-icon">' + icon + '</span><span class="flow-label">' + esc(label) + '</span></div>';
}

function renderFlowChain(nodes){
  var out = nodes.map(function(n, i){
    var html = flowNode(n.label, n.icon, n.me);
    if (i < nodes.length - 1) html += '<span class="flow-arrow">→</span>';
    return html;
  }).join("");
  return '<div class="flow-label-row">Кто участвует и в каком порядке</div><div class="flow-chain">' + out + '</div>';
}

function actorFlowNodes(actors, role){
  return actors.map(function(a){ return {label:a, icon:roleIcon(a), me: a === role}; });
}

function parseRouteChain(text){
  var afterColon = text.indexOf(':') !== -1 ? text.slice(text.indexOf(':') + 1) : text;
  return afterColon.split('→').map(function(s){ return s.replace(/\.\s*$/, '').trim(); }).filter(Boolean);
}

function routeFlowNodes(text, role){
  var labels = parseRouteChain(text);
  return labels.map(function(l, i){
    var isLast = i === labels.length - 1;
    return {label:l, icon: isLast ? "🖋" : "👤", me: role ? l.indexOf(role) !== -1 : false};
  });
}

function renderJointFlow(actors, role){
  var out = actors.map(function(a){ return flowNode(a, roleIcon(a), a === role); }).join('<span class="flow-plus">+</span>');
  return '<div class="flow-label-row">Действуют вместе, параллельно</div><div class="flow-chain">' + out + '</div>';
}

function docNode(icon, label, sub){
  return '<div class="flow-node doc"><span class="flow-icon">' + icon + '</span><span class="flow-label">' + esc(label) + '</span>' +
    (sub ? '<span class="flow-doc-sub">' + esc(sub) + '</span>' : '') + '</div>';
}

function nodeWithCaption(label, icon, me, caption){
  return '<div class="flow-node-wrap"><div class="flow-node' + (me ? ' me' : '') + '"><span class="flow-icon">' + icon + '</span><span class="flow-label">' + esc(label) + '</span></div>' +
    (caption ? '<div class="flow-role-note">' + esc(caption) + '</div>' : '') + '</div>';
}

function renderDeliverFlow(flow, role){
  var fromHtml = nodeWithCaption(flow.from, roleIcon(flow.from), flow.from === role, flow.fromLabel);
  var toHtml = nodeWithCaption(flow.to, roleIcon(flow.to), flow.to === role, flow.toLabel);
  var midHtml = docNode(flow.doc.icon, flow.doc.label, flow.doc.sub);
  return '<div class="flow-label-row">Что передаётся и кому</div><div class="flow-chain">' +
    fromHtml + '<span class="flow-arrow">→</span>' + midHtml + '<span class="flow-arrow">→</span>' + toHtml +
  '</div>';
}

function renderDualFlow(flow, role){
  var blocks = flow.flows.map(function(f){
    var fromHtml = nodeWithCaption(f.from, roleIcon(f.from), f.from === role, f.fromLabel);
    var toHtml = nodeWithCaption(f.to, roleIcon(f.to), f.to === role, f.toLabel);
    var midHtml = f.doc ? ('<span class="flow-arrow">→</span>' + docNode(f.doc.icon, f.doc.label, f.doc.sub)) : '';
    return '<div class="flow-dual-block"><div class="flow-dual-label">' + esc(f.label) + '</div><div class="flow-chain">' +
      fromHtml + midHtml + '<span class="flow-arrow">→</span>' + toHtml + '</div></div>';
  }).join('<div class="flow-dual-divider"></div>');
  return '<div class="flow-label-row">Два независимых действия</div>' + blocks;
}

function renderChecklist(cl){
  var itemsHtml = cl.items.map(function(it){
    return '<div class="checklist-item"><span class="checklist-check">✓</span><span>' + esc(it) + '</span></div>';
  }).join("");
  return '<div class="checklist"><div class="checklist-head">' + esc(cl.head) + '</div><div class="checklist-items">' + itemsHtml + '</div></div>';
}

function renderDocIO(docs){
  var inputItems = (docs.input || []).map(function(d){
    return '<div class="doc-io-item in"><span class="doc-io-icon">📥</span><span>' + esc(d.label) +
      (d.from ? ' <span class="doc-io-tag">от ' + esc(d.from) + '</span>' : '') + '</span></div>';
  }).join("");
  var outputItems = (docs.output || []).map(function(d){
    return '<div class="doc-io-item out"><span class="doc-io-icon">📤</span><span>' + esc(d.label) +
      (d.to ? ' <span class="doc-io-tag">→ ' + esc(d.to) + '</span>' : '') + '</span></div>';
  }).join("");
  var inCol = inputItems ? '<div class="doc-io-col"><div class="doc-io-head in">📥 На входе нужно</div>' + inputItems + '</div>' : "";
  var outCol = outputItems ? '<div class="doc-io-col"><div class="doc-io-head out">📤 На выходе → кому</div>' + outputItems + '</div>' : "";
  if (!inCol && !outCol) return "";
  return '<div class="doc-io">' + inCol + outCol + '</div>';
}

function renderCondItems(items){
  return '<div class="cond-list">' + items.map(function(it){
    return '<div class="cond-item"><span class="cond-check">✓</span><span>' + esc(it) + '</span></div>';
  }).join("") + '</div>';
}

function renderConvergeFlow(flow, role){
  var isApprove = flow.type === "approve";
  var header = isApprove ? "Кто согласует, а кто утверждает" : "Кто передаёт данные, а кто на их основе действует";
  var clusterNodes = flow.group.map(function(r){ return flowNode(r, roleIcon(r), r === role); }).join('<span class="flow-plus">+</span>');
  var targetCls = "flow-node " + (isApprove ? "target-approve" : "target-converge") + (flow.target === role ? " me" : "");
  var targetHtml = '<div class="' + targetCls + '"><span class="flow-icon">' + roleIcon(flow.target) + '</span><span class="flow-label">' + esc(flow.target) + '</span></div>';
  return '<div class="flow-label-row">' + esc(header) + '</div>' +
    '<div class="flow-approve">' +
      '<div class="flow-cluster">' +
        '<div class="flow-cluster-label">' + esc(flow.groupLabel) + '</div>' +
        '<div class="flow-cluster-nodes">' + clusterNodes + '</div>' +
      '</div>' +
      '<div class="flow-big-arrow">→<span class="flow-arrow-label">' + esc(flow.targetLabel) + '</span></div>' +
      targetHtml +
    '</div>';
}

function momentBodyHTML(m, role){
  var item = m.item;
  var kind = m.kind;
  var effRole = kind === "step-overview" ? null : role;

  if (kind === "step" || kind === "step-overview"){
    var isRoute = item.actors && item.actors.length === 1 && item.actors[0].indexOf("маршрут") === 0;
    var flowHtml = "";
    if (isRoute){
      flowHtml = renderFlowChain(routeFlowNodes(item.text, effRole));
    } else if (item.flow && item.flow.type === "joint"){
      flowHtml = renderJointFlow(item.actors, effRole);
    } else if (item.flow && (item.flow.type === "approve" || item.flow.type === "converge")){
      flowHtml = renderConvergeFlow(item.flow, effRole);
    } else if (item.flow && item.flow.type === "deliver"){
      flowHtml = renderDeliverFlow(item.flow, effRole);
    } else if (item.flow && item.flow.type === "dual"){
      flowHtml = renderDualFlow(item.flow, effRole);
    } else if (item.actors && item.actors.length >= 2){
      flowHtml = renderFlowChain(actorFlowNodes(item.actors, effRole));
    } else if (item.actors && item.actors.length === 1){
      flowHtml = '<div class="flow-label-row">Кто выполняет</div><div class="flow-chain">' +
        flowNode(item.actors[0], roleIcon(item.actors[0]), item.actors[0] === effRole) + '</div>';
    } else {
      flowHtml = '<div class="flow-label-row">Кто выполняет</div><div class="flow-chain">' +
        flowNode("процесс / система", "⚙️", false) + '</div>';
    }
    var checklistHtml = item.checklist ? renderChecklist(item.checklist) : "";
    var docIOHtml = item.docs ? renderDocIO(item.docs) : "";
    var slaHtml = item.sla ? chip(item.sla, "sla") : "";
    var paraHtml = chip("§" + item.no, "para");
    var raciHtml = "";
    if (kind === "step-overview"){
      raciHtml = renderRaciBreakdown(item);
    } else {
      var code = raciCode(item, role);
      if (code) paraHtml += chip("RACI: " + code, "raci");
    }
    var branchHtml = "";
    if (item.branch){
      branchHtml = '<button type="button" class="branch-btn" data-action="branch-toggle">' +
        (branchOpen ? "Скрыть вариант развития" : "А если пойдёт не по плану? →") + '</button>' +
        (branchOpen ? '<div class="branch-panel">' + esc(item.branch) + '</div>' : "");
    }
    return '<div class="chip-row">' + paraHtml + slaHtml + '</div>' +
      '<div class="moment-text">' + esc(item.text) + '</div>' +
      checklistHtml +
      flowHtml +
      docIOHtml +
      raciHtml +
      branchHtml;
  }

  if (kind === "gate-review"){
    var outcome = "";
    if (gateChoice === "good"){
      outcome = '<div class="g-outcome good">Гейт пройден. Документы МП подтверждены — проект продолжает движение к следующему этапу.</div>';
    } else if (gateChoice === "bad"){
      outcome = '<div class="g-outcome bad">Возврат в МП с перечнем конкретных замечаний. Если замечания не устранены и повторной проверки нет в течение 2 рабочих дней — вопрос автоматически уходит на эскалацию: ' + esc(item.esc) + '.</div>';
    }
    var raciCodeSmik = raciCode(item, role);
    return '<div class="chip-row">' + chip("Gate " + item.id.slice(1), "para") + (raciCodeSmik ? chip("RACI: " + raciCodeSmik, "raci") : "") + '</div>' +
      '<div class="moment-text">' + esc(item.title) + '</div>' +
      renderFlowChain([{label:"МП готовит документы", icon:roleIcon("МП"), me:false}, {label:"СМиК (вы) проверяет", icon:roleIcon("СМиК"), me:true}]) +
      '<div class="gate-box">' +
        '<div class="g-title">Условие прохождения</div>' +
        (item.condItems ? renderCondItems(item.condItems) : '<div class="g-cond">' + esc(item.cond) + '</div>') +
        '<div class="g-esc">Более 2 р.д. без решения → эскалация: ' + esc(item.esc) + '</div>' +
        '<div class="g-independence">' + esc(GATE_INDEPENDENCE_NOTE) + '</div>' +
        '<div class="g-choices">' +
          '<button type="button" class="btn good' + (gateChoice==="good"?" picked":"") + '" data-action="gate-choice" data-choice="good">✓ Отметить «Готово»</button>' +
          '<button type="button" class="btn bad' + (gateChoice==="bad"?" picked":"") + '" data-action="gate-choice" data-choice="bad">↺ Отметить «Не готово»</button>' +
        '</div>' +
        outcome +
      '</div>';
  }

  if (kind === "gate-escalation"){
    var guide = escalOpen ? '<div class="g-guide">Как ГД ДУП, ваша задача — снять затор: разобраться, почему СМиК не смог принять решение, и либо утвердить гейт, либо направить конкретные замечания на устранение. Это последняя точка эскалации в Едином регламенте — дальше решать некому.</div>' : "";
    var raciCodeGd = raciCode(item, role);
    return '<div class="chip-row">' + chip("Gate " + item.id.slice(1), "para") + (raciCodeGd ? chip("RACI: " + raciCodeGd, "raci") : "") + '</div>' +
      '<div class="moment-text">' + esc(item.title) + '</div>' +
      renderFlowChain([{label:"СМиК не решил за 2 р.д.", icon:roleIcon("СМиК"), me:false}, {label:"ГД ДУП (вы) решает", icon:roleIcon("ГД ДУП"), me:true}]) +
      '<div class="gate-box">' +
        '<div class="g-title">Что должно быть выполнено</div>' +
        (item.condItems ? renderCondItems(item.condItems) : '<div class="g-cond">' + esc(item.cond) + '</div>') +
        '<div class="g-esc">Эскалация приходит к вам, если СМиК не принял решение за 2 рабочих дня.</div>' +
        '<div class="g-independence">' + esc(GATE_INDEPENDENCE_NOTE) + '</div>' +
        '<button type="button" class="btn primary g-reveal-btn" data-action="escal-toggle">' + (escalOpen ? "Скрыть" : "Рассмотреть эскалацию →") + '</button>' +
        guide +
      '</div>';
  }

  if (kind === "gate-overview"){
    return '<div class="chip-row">' + chip("Gate " + item.id.slice(1), "para") + '</div>' +
      '<div class="moment-text">' + esc(item.title) + '</div>' +
      renderFlowChain([{label:"МП готовит документы", icon:roleIcon("МП"), me:false}, {label:"СМиК проверяет", icon:roleIcon("СМиК"), me:false}]) +
      '<div class="gate-box">' +
        '<div class="g-title">Условие прохождения</div>' +
        (item.condItems ? renderCondItems(item.condItems) : '<div class="g-cond">' + esc(item.cond) + '</div>') +
        '<div class="g-esc">Более 2 р.д. без решения → эскалация: ' + esc(item.esc) + '</div>' +
        '<div class="g-independence">' + esc(GATE_INDEPENDENCE_NOTE) + '</div>' +
      '</div>' +
      renderRaciBreakdown(item);
  }
  return "";
}

function renderStageStrip(touchedStages, currentStageId){
  var dots = "";
  for (var i=1;i<=9;i++){
    var touched = touchedStages.indexOf(i) !== -1;
    var cur = i === currentStageId;
    dots += '<div class="stage-dot-wrap"><div class="stage-dot' + (touched?' touched':'') + (cur?' current':'') + '" title="Этап ' + i + '"></div></div>';
  }
  return '<div class="stage-strip">' + dots + '</div>';
}

function renderWalk(){
  var m = journey[idx];
  var roleLabel = activeKey === "overview" ? "Весь процесс" : activeKey;
  var touched = stagesTouched(journey);
  var pct = journey.length ? Math.round(((idx+1) / journey.length) * 100) : 0;
  var isLast = idx === journey.length - 1;

  var triggerHtml = "";
  if (m.isFirstOfStage){
    triggerHtml = '<div class="moment-trigger"><b>Этап ' + m.stage.id + ' · ' + esc(m.stage.title) + '</b> начинается, когда: ' + esc(m.stage.trigger) + '</div>';
  }

  var std = ROLE_STANDARD[activeKey];
  var frameworkHtml = "";
  if (std){
    frameworkHtml = '<div class="walk-framework">' +
      '<button type="button" class="std-toggle" data-action="framework-toggle">' + (frameworkOpen ? "Скрыть" : "📚 " + esc(std.badge) + " →") + '</button>' +
      (frameworkOpen ? '<div class="std-panel">' + stdCardHTML(std) + '</div>' : "") +
    '</div>';
  }

  return '' +
  '<div class="walk-top">' +
    '<div class="walk-role">' + esc(roleLabel) + '</div>' +
    '<button type="button" class="walk-back" data-action="intro">← Другая роль</button>' +
  '</div>' +
  frameworkHtml +
  '<div class="walk-count">Момент ' + (idx+1) + ' из ' + journey.length + ' · этап ' + m.stage.id + ' из 9</div>' +
  '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
  renderStageStrip(touched, m.stage.id) +
  '<div class="moment-card">' +
    '<div class="moment-kicker">Этап ' + m.stage.id + ' · ' + esc(m.stage.title) + '</div>' +
    triggerHtml +
    momentBodyHTML(m, activeKey) +
  '</div>' +
  '<div class="nav-row">' +
    '<button type="button" class="btn ghost" data-action="back"' + (idx===0?' disabled':'') + '>← Назад</button>' +
    '<span class="nav-spacer"></span>' +
    '<button type="button" class="btn primary" data-action="next">' + (isLast ? "Завершить →" : "Далее →") + '</button>' +
  '</div>';
}

/* ---------- render: done ---------- */

function renderDone(){
  var roleLabel = activeKey === "overview" ? "Весь процесс" : activeKey;
  var touched = stagesTouched(journey);
  var stageChips = touched.map(function(sid){ return chip("Этап " + sid); }).join("");
  var recap = journey.map(function(m){
    var it = m.item;
    var label = it.t === "gate" ? "Gate " + it.id.slice(1) : "§" + it.no;
    var text = it.t === "gate" ? it.title : it.text;
    return '<div class="recap-item"><span class="rp">' + esc(label) + '</span><span class="rt">' + esc(text) + '</span></div>';
  }).join("");

  return '' +
  '<div class="kicker">ДУП · Единый регламент</div>' +
  '<div class="done-hero">' +
    '<div class="done-big">' + esc(roleLabel) + '</div>' +
    '<div class="done-sub">Путь пройден — ' + journey.length + ' ' + pluralMoments(journey.length) + ' процесса, где действуете вы' + (activeKey==="overview" ? " все вместе" : "") + '.</div>' +
    '<div class="done-stages">' + stageChips + '</div>' +
    '<div class="done-actions">' +
      '<button type="button" class="btn primary" data-action="restart">Пройти ещё раз</button>' +
      '<button type="button" class="btn" data-action="intro">Выбрать другую роль</button>' +
    '</div>' +
  '</div>' +
  '<div class="recap">' +
    '<h2>Шпаргалка — весь ваш путь одним списком</h2>' +
    recap +
  '</div>' +
  '<footer>Ничего не сохраняется и не оценивается — возвращайтесь в любой момент, чтобы освежить свою часть Единого регламента ДУП. §-ссылки указывают на пункт полного текста документа.</footer>';
}

/* ---------- root render ---------- */

function render(){
  var root = document.getElementById("pageRoot");
  if (screen === "intro") root.innerHTML = renderIntro();
  else if (screen === "walk") root.innerHTML = renderWalk();
  else root.innerHTML = renderDone();
  window.scrollTo(0,0);
}

function onClick(e){
  var t = e.target.closest("[data-action]");
  if (!t) return;
  var action = t.getAttribute("data-action");

  if (action === "start"){
    activeKey = t.getAttribute("data-key");
    journey = buildJourney(activeKey);
    idx = 0;
    resetMomentState();
    frameworkOpen = false;
    screen = "walk";
    render();
    return;
  }
  if (action === "intro"){
    screen = "intro";
    activeKey = null;
    standardsOpen = false;
    render();
    return;
  }
  if (action === "restart"){
    idx = 0;
    resetMomentState();
    frameworkOpen = false;
    screen = "walk";
    render();
    return;
  }
  if (action === "back"){
    if (idx > 0){ idx--; resetMomentState(); render(); }
    return;
  }
  if (action === "next"){
    if (idx < journey.length - 1){ idx++; resetMomentState(); render(); }
    else { screen = "done"; render(); }
    return;
  }
  if (action === "branch-toggle"){
    branchOpen = !branchOpen;
    render();
    return;
  }
  if (action === "gate-choice"){
    gateChoice = t.getAttribute("data-choice");
    render();
    return;
  }
  if (action === "escal-toggle"){
    escalOpen = !escalOpen;
    render();
    return;
  }
  if (action === "standards-toggle"){
    standardsOpen = !standardsOpen;
    render();
    return;
  }
  if (action === "raci-toggle"){
    raciTableOpen = !raciTableOpen;
    render();
    return;
  }
  if (action === "framework-toggle"){
    frameworkOpen = !frameworkOpen;
    render();
    return;
  }
}

document.addEventListener("click", onClick);
render();
