<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моя роль · ДУП</title>
  <script src="../../../assets/js/theme.js"></script>
  <style>
    :root{--loader-bg:#eef2f1;--loader-surface:#fff;--loader-ink:#16232a;--loader-muted:#56666d;--loader-line:#c3cecb;--loader-accent:#2b6e62}
    :root[data-theme="dark"]{--loader-bg:#0d1412;--loader-surface:#141d1a;--loader-ink:#edf5f2;--loader-muted:#a9bbb5;--loader-line:#30413b;--loader-accent:#72d2bd}
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;background:var(--loader-bg);color:var(--loader-ink);font:14px/1.5 "Segoe UI",Arial,sans-serif}
    .loader{display:flex;align-items:center;gap:12px;color:var(--loader-muted)}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--loader-accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--loader-accent) 12%,transparent)}
    .error{max-width:680px;padding:28px;border:1px solid var(--loader-line);border-radius:16px;background:var(--loader-surface)}
    .error h1{margin:0 0 10px;font-size:20px}.error code{color:var(--loader-accent)}
  </style>
</head>
<body>
  <div class="loader" id="loader"><span class="dot"></span><span>Открываю шпаргалку…</span></div>
  <script>
    (async function () {
      try {
        const response = await fetch('./dup_game_1.html', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const bytes = await response.arrayBuffer();
        let html = new TextDecoder('utf-8').decode(bytes);

        const portalUi = `
          <link rel="stylesheet" href="../../../assets/css/game-v5.css">
          <link rel="stylesheet" href="../../../assets/css/header-v6.css">
          <script src="../../../assets/js/theme.js"><\/script>
          <script src="../../../assets/js/game-v5.js"><\/script>
        `;

        if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, portalUi + '</body>');
        else html += portalUi;
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = `
          <div class="error">
            <h1>Не удалось открыть шпаргалку</h1>
            <p>Проверьте, что файл <code>processes/realization/guide/dup_game_1.html</code> находится рядом с этой страницей.</p>
            <p>${String(error.message || error)}</p>
          </div>`;
      }
    })();
  </script>
</body>
</html>
