<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моя роль · ДУП</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;background:#0f1613;color:#dce8e3;font:14px/1.5 "Segoe UI",Arial,sans-serif}
    .loader{display:flex;align-items:center;gap:12px;color:#9fb0ab}
    .dot{width:10px;height:10px;border-radius:50%;background:#7fd0bd;box-shadow:0 0 0 6px rgba(127,208,189,.12)}
    .error{max-width:680px;padding:28px;border:1px solid #2b3a36;border-radius:16px;background:#161f1c}
    .error h1{margin:0 0 10px;font-size:20px;color:#fff}
    .error code{color:#bdf0e0}
  </style>
</head>
<body>
  <div class="loader" id="loader"><span class="dot"></span><span>Открываю шпаргалку…</span></div>
  <script>
    (async function () {
      try {
        const response = await fetch('./dup_game_1.html', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const bytes = await response.arrayBuffer();
        let html = new TextDecoder('utf-8').decode(bytes);

        const portalUi = `
          <style id="dup-portal-standalone-ui">
            .dup-portal-back{
              position:fixed;left:18px;bottom:18px;z-index:2147483647;
              display:inline-flex;align-items:center;gap:7px;
              padding:9px 13px;border:1px solid rgba(127,208,189,.45);
              border-radius:999px;background:rgba(15,22,19,.88);color:#dff7ef;
              font:600 12px/1.2 "Segoe UI",Arial,sans-serif;text-decoration:none;
              box-shadow:0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(12px)
            }
            .dup-portal-back:hover{background:rgba(22,48,42,.96)}
          </style>
          <a class="dup-portal-back" href="../" aria-label="Вернуться к процессу">← К процессу</a>
        `;

        html += portalUi;
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = `
          <div class="error">
            <h1>Не удалось открыть шпаргалку</h1>
            <p>Проверьте, что файл <code>processes/realization/guide/dup_game_1.html</code> находится рядом с этой страницей.</p>
            <p>${String(error.message || error)}</p>
          </div>`;
      }
    })();
  </script>
</body>
</html>
